{{- if not .Values.appsDomain }}{{ fail "appsDomain is required (set by bootstrap.sh)" }}{{ end }}
{{- $root := . }}
{{- $apps := list
  (dict "name" "operators"       "enabled" .Values.components.operators      "wave" "0" "path" "components/operators"       "helm" false)
  (dict "name" "gitlab"          "enabled" .Values.components.gitlab         "wave" "1" "path" "components/gitlab"          "helm" true  "ns" "gitlab")
  (dict "name" "keycloak-config" "enabled" .Values.components.keycloakConfig "wave" "1" "path" "components/keycloak-config" "helm" true  "ns" "keycloak")
  (dict "name" "gitops-config"   "enabled" .Values.components.gitopsConfig   "wave" "1" "path" "components/gitops-config"   "helm" true  "ns" "openshift-gitops")
  (dict "name" "ci-triggers"     "enabled" .Values.components.ciTriggers     "wave" "1" "path" "components/ci-triggers"     "helm" true  "ns" "rhdh-demo-ci")
  (dict "name" "orchestrator-infra"     "enabled" .Values.components.orchestrator "wave" "1" "path" "components/orchestrator-infra"     "helm" true "ns" "openshift-serverless")
  (dict "name" "devspaces"              "enabled" .Values.components.devSpaces    "wave" "0" "path" "components/devspaces"              "helm" true "ns" "openshift-devspaces")
  (dict "name" "quay"                   "enabled" .Values.components.quay         "wave" "1" "path" "components/quay"                   "helm" true "ns" "quay")
  (dict "name" "developer-hub"   "enabled" .Values.components.developerHub   "wave" "3" "path" "components/developer-hub"   "helm" true  "ns" "rhdh")
  (dict "name" "orchestrator-workflows" "enabled" .Values.components.orchestrator "wave" "4" "path" "components/orchestrator-workflows" "helm" true "ns" "rhdh")
}}
{{- range $apps }}
{{- if .enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .wave }}"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .ns | default "openshift-gitops" }}
  source:
    repoURL: {{ $root.Values.repoURL }}
    targetRevision: {{ $root.Values.targetRevision }}
    path: {{ .path }}
    {{- if .helm }}
    helm:
      valuesObject:
        appsDomain: {{ $root.Values.appsDomain }}
        components: {{ $root.Values.components | toJson }}
        platformRepo: {{ $root.Values.repoURL }}
      {{- if eq .name "gitlab" }}
      # the commit Argo CD synced: the seed copies software-templates/ from it
      parameters:
        - {name: platformRevision, value: $ARGOCD_APP_REVISION}
      {{- end }}
    {{- end }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: {limit: 20, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
{{- end }}
{{- end }}
{{- if .Values.components.demoLayer }}
---
# Demo layer: per-demo content (branding, catalog locations, RBAC) in the in-cluster
# GitLab, seeded by the gitlab component. Change it there, not in this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-layer
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: {server: https://kubernetes.default.svc, namespace: rhdh}
  sources:
    - repoURL: https://gitlab.{{ .Values.appsDomain }}/{{ .Values.demoLayer.repoPath }}.git
      targetRevision: main
      path: {{ .Values.demoLayer.path }}
    # Platform-owned hooks that run on every demo-layer sync (Keycloak org sync).
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: components/demo-layer-hooks
      helm:
        valuesObject:
          appsDomain: {{ .Values.appsDomain }}
          components: {{ .Values.components | toJson }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 20, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
{{- end }}
