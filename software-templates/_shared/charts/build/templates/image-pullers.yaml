{{- if eq .Values.registry "openshift" }}
# The environments pull the image from this namespace's ImageStream.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.component }}-image-pullers
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:image-puller"}
subjects:
  {{- range .Values.environments }}
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:serviceaccounts:{{ .namespace }}"}
  {{- end }}
{{- end }}
