apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: poi-map-template
  title: Angular SPA for Points-of-Interest Map (workshop)
  description: >-
    Creates the Angular map of the points-of-interest workshop: it shows the gateway's points of interest on an OpenStreetMap map.
  tags: [typescript, angular, workshop]
  annotations:
    # ported from the Red Hat Summit 2023 Backstage workshop (redhat-scholars/backstage-workshop)
    backstage.io/source-location: url:https://gitlab.__APPS_DOMAIN__/platform/software-templates/-/tree/main/poi-map
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Provide information about the new component
      required: [space, owner]
      properties:
        space:
          title: Workshop space
          type: string
          description: >-
            Your workshop space: the backend, gateway and map of one attendee share it
            (namespace demo-<space>). Lowercase letters, digits and dashes. Create it last, in the same workshop space as the backend and gateway.
          pattern: '^[a-z][a-z0-9-]{1,12}[a-z0-9]$'
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: The team that owns the component (its Argo CD project shows the apps)
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        description:
          title: Description
          type: string
          description: Help others understand what this component is for
          default: Angular SPA for Points-of-Interest Map
    - title: Provide Build Information
      required: [image_registry]
      properties:
        image_registry:
          title: Image Registry
          type: string
          default: Openshift
          enum: [Openshift, Quay]
          enumNames: [OpenShift internal registry, Quay (organization development)]

  steps:
    - id: templateSource
      name: Generating the source code component
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./app
        copyWithoutTemplating:
          - src/main/resources/data/*
          - src/main/resources/META-INF/resources/*
          - package-lock.json
        values:
          component_id: ${{ parameters.space }}-poi-map
          space: ${{ parameters.space }}
          repoName: ${{ parameters.space }}-poi-map
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          registry: ${{ 'quay' if parameters.image_registry == 'Quay' else 'openshift' }}
    - id: publishSource
      name: Publishing to the Source Code Repository
      action: publish:gitlab
      input:
        repoUrl: gitlab.__APPS_DOMAIN__?owner=development&repo=${{ parameters.space }}-poi-map
        sourcePath: ./app
        repoVisibility: public
        defaultBranch: main
        topics:
          - team-${{ parameters.owner | parseEntityRef | pick('name') }}
          - workshop
    - id: registerSource
      name: Registering the Catalog Info Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publishSource.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
    - id: templateGitopsCharts
      name: Generating the deployment resources
      action: fetch:template
      input:
        url: ../_shared/charts
        targetPath: ./gitops/helm
        values:
          component: ${{ parameters.space }}-poi-map
          repo: ${{ parameters.space }}-poi-map
          space: ${{ parameters.space }}
          partOf: workshop-system-${{ parameters.space }}
          runtime: angularjs
          port: 8080
          memoryLimit: 256Mi
          containerfile: ./Dockerfile
          gitUrl: https://gitlab.__APPS_DOMAIN__/development/${{ parameters.space }}-poi-map.git
          buildNamespace: demo-${{ parameters.space }}-poi-map
          registry: ${{ 'quay' if parameters.image_registry == 'Quay' else 'openshift' }}
          imageRepository: ${{ ('quay.__APPS_DOMAIN__/development/' + parameters.space + '-poi-map') if parameters.image_registry == 'Quay' else ('image-registry.openshift-image-registry.svc:5000/demo-' + parameters.space + '-poi-map/poi-map') }}
          imageStream: poi-map
    - id: templateGitops
      name: Generating the environments
      action: fetch:template
      input:
        url: ./gitops
        targetPath: ./gitops
        values:
          component: ${{ parameters.space }}-poi-map
          repo: ${{ parameters.space }}-poi-map
          space: ${{ parameters.space }}
          partOf: workshop-system-${{ parameters.space }}
          runtime: angularjs
          port: 8080
          memoryLimit: 256Mi
          containerfile: ./Dockerfile
          gitUrl: https://gitlab.__APPS_DOMAIN__/development/${{ parameters.space }}-poi-map.git
          buildNamespace: demo-${{ parameters.space }}-poi-map
          registry: ${{ 'quay' if parameters.image_registry == 'Quay' else 'openshift' }}
          imageRepository: ${{ ('quay.__APPS_DOMAIN__/development/' + parameters.space + '-poi-map') if parameters.image_registry == 'Quay' else ('image-registry.openshift-image-registry.svc:5000/demo-' + parameters.space + '-poi-map/poi-map') }}
          imageStream: poi-map
    - id: publishGitops
      name: Publishing to Deployment Resource Repository
      action: publish:gitlab
      input:
        repoUrl: gitlab.__APPS_DOMAIN__?owner=development&repo=${{ parameters.space }}-poi-map-gitops
        sourcePath: ./gitops
        repoVisibility: public
        defaultBranch: main
        topics:
          - team-${{ parameters.owner | parseEntityRef | pick('name') }}
          - gitops

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps.publishSource.output.remoteUrl }}
      - title: Open Component in catalog
        icon: catalog
        entityRef: ${{ steps.registerSource.output.entityRef }}
      - title: Application
        url: https://${{ parameters.space }}-poi-map.__APPS_DOMAIN__/
    text:
      - title: What happens next
        content: |
          Argo CD creates **${{ parameters.space }}-poi-map-build** (Tekton pipeline in namespace
          demo-${{ parameters.space }}-poi-map) and **${{ parameters.space }}-poi-map-dev** (the
          application in namespace demo-${{ parameters.space }}) within a minute. The first build
          takes a few minutes; every push to `main` builds and deploys again.
