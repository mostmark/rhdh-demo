apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: quarkus-web-template
  title: Quarkus Service with ArgoCD and a Tekton Pipeline
  description: >-
    Create a simple microservice using Quarkus with Argo CD and a Tekton pipeline: an
    application repository, a GitOps repository and three environments (dev, preprod,
    prod). Every push to main builds and deploys to dev; a Git tag promotes to preprod
    (v1.0) or prod (prod-v1.0).
  tags:
    - recommended
    - java
    - quarkus
    - maven
  annotations:
    # ported from the RHDP Developer Hub catalog item (rhpds/developer-hub-software-templates)
    backstage.io/source-location: url:https://gitlab.__APPS_DOMAIN__/platform/software-templates/-/tree/main/quarkus-service
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Provide Information for Application
      required: [component_id, owner, java_package_name]
      properties:
        component_id:
          title: Name
          type: string
          description: >-
            Unique name of the component: lowercase letters, digits and dashes. Becomes the
            repositories <name> and <name>-gitops and the namespaces demo-<name>(-dev, -preprod, -prod).
          default: my-quarkus-app
          pattern: '^[a-z][a-z0-9-]{1,18}[a-z0-9]$'
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: The team that owns the service (its Argo CD project shows the apps)
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        system:
          title: System
          type: string
          description: The system the service belongs to (optional)
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
        group_id:
          title: Group Id
          type: string
          default: redhat.janus
          description: Maven Group Id
        artifact_id:
          title: Artifact Id
          type: string
          default: quarkus-app
          description: Maven Artifact Id
        java_package_name:
          title: Java Package Name
          default: org.redhat.janus
          type: string
          description: Name for the java package. eg (com.redhat.blah)
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        description:
          title: Description
          type: string
          description: Help others understand what this service is for.
          default: A cool quarkus app
    - title: Provide Image Registry Information
      required: [image_registry]
      properties:
        image_registry:
          title: Image Registry
          type: string
          default: Openshift
          enum: [Openshift, Quay]
          enumNames: [OpenShift internal registry, Quay (organization development)]
          description: Where the pipeline pushes the image. Quay images show in the Quay tab.

  steps:
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./app
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          group_id: ${{ parameters.group_id }}
          artifact_id: ${{ parameters.artifact_id }}
          java_package_name: ${{ parameters.java_package_name }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          registry: ${{ 'quay' if parameters.image_registry == 'Quay' else 'openshift' }}
          port: 8080

    - id: publish
      name: Publish
      action: publish:gitlab
      input:
        repoUrl: gitlab.__APPS_DOMAIN__?owner=development&repo=${{ parameters.component_id }}
        sourcePath: ./app
        repoVisibility: public
        defaultBranch: main
        topics:
          - team-${{ parameters.owner | parseEntityRef | pick('name') }}
          - quarkus

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: template-gitops-charts
      name: Generating Deployment Resources
      action: fetch:template
      input:
        url: ../_shared/charts
        targetPath: ./gitops/helm
        values:
          component: ${{ parameters.component_id }}
          repo: ${{ parameters.component_id }}
          partOf: ${{ parameters.system | parseEntityRef | pick('name') if parameters.system else parameters.component_id }}
          runtime: quarkus
          port: 8080
          memoryLimit: 512Mi
          containerfile: ./Dockerfile
          gitUrl: https://gitlab.__APPS_DOMAIN__/development/${{ parameters.component_id }}.git
          buildNamespace: demo-${{ parameters.component_id }}
          registry: ${{ 'quay' if parameters.image_registry == 'Quay' else 'openshift' }}
          imageRepository: ${{ ('quay.__APPS_DOMAIN__/development/' + parameters.component_id) if parameters.image_registry == 'Quay' else ('image-registry.openshift-image-registry.svc:5000/demo-' + parameters.component_id + '/' + parameters.component_id) }}
          imageStream: ${{ parameters.component_id }}

    - id: template-gitops-environments
      name: Generating the environments
      action: fetch:template
      input:
        url: ./gitops
        targetPath: ./gitops
        values:
          component: ${{ parameters.component_id }}
          repo: ${{ parameters.component_id }}
          partOf: ${{ parameters.system | parseEntityRef | pick('name') if parameters.system else parameters.component_id }}
          runtime: quarkus
          port: 8080
          memoryLimit: 512Mi
          containerfile: ./Dockerfile
          gitUrl: https://gitlab.__APPS_DOMAIN__/development/${{ parameters.component_id }}.git
          buildNamespace: demo-${{ parameters.component_id }}
          registry: ${{ 'quay' if parameters.image_registry == 'Quay' else 'openshift' }}
          imageRepository: ${{ ('quay.__APPS_DOMAIN__/development/' + parameters.component_id) if parameters.image_registry == 'Quay' else ('image-registry.openshift-image-registry.svc:5000/demo-' + parameters.component_id + '/' + parameters.component_id) }}
          imageStream: ${{ parameters.component_id }}

    - id: publish-gitops
      name: Publishing to Resource Repository
      action: publish:gitlab
      input:
        repoUrl: gitlab.__APPS_DOMAIN__?owner=development&repo=${{ parameters.component_id }}-gitops
        sourcePath: ./gitops
        repoVisibility: public
        defaultBranch: main
        topics:
          - team-${{ parameters.owner | parseEntityRef | pick('name') }}
          - gitops

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open Component in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: What happens next
        content: |
          Argo CD creates four applications within a minute: **${{ parameters.component_id }}-build**
          (Tekton pipelines in namespace demo-${{ parameters.component_id }}) and
          **${{ parameters.component_id }}-dev**, **-preprod**, **-prod**. The first build takes a
          few minutes (Maven downloads); then all three environments run the same image.

          - Push to `main` → build and deploy to **dev**.
          - Push a tag `v1.0` → promote the dev image to **preprod**.
          - Push a tag `prod-v1.0` → promote the preprod image to **prod**.
