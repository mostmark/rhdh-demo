appsDomain: ""
components: {}
# Images of the Quay operator's stable-3.17 channel (quay-operator.v3.17.7)
images:
  quay: registry.redhat.io/quay/quay-rhel9@sha256:ea52646fd3b596f5bc8e977876a7ff9f8b8edbad9770bc6790f614b6ff61d525
  postgres: registry.redhat.io/rhel9/postgresql-15@sha256:24320a40760f17f867aa1d05f0f82268008ac537f502de83a2b477c19bc3e2ad
  redis: registry.redhat.io/rhel9/redis-7@sha256:77255a5ac8fb67511e32dc3fa83cfcab1bbbad7ca773af16334cf0ad6de794fb
  clair: registry.redhat.io/quay/clair-rhel9@sha256:85055d2f1e524b8272fb74e9727c3ac5335e2ee2cdf7cfb862ac15784fafe1a7
  cli: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
storage:
  registry: 30Gi
  database: 5Gi
  clairDatabase: 20Gi
adminUser: quayadmin
# Security scanning: Quay sends manifests to Clair (templates/clair.yaml) at this address.
scanner:
  endpoint: http://clair:8080
clair:
  enabled: true
  # Clair updater sets (vulnerability sources): rhel-vex (Red Hat VEX: RHEL/UBI packages and
  # Red Hat container images), osv (Java/npm/Python... dependencies) and clair.cvss (CVSS
  # scores); enough for the demo's UBI-based images. The Clair default (all distributions)
  # needs far more time and database space. Unknown set names are silently ignored.
  updaters: rhel-vex osv clair.cvss
  memoryLimit: 3Gi
# OAuth application whose 10-year token (Secret quay-admin, key token) the demo layer's
# Quay hook uses to create organizations and repositories and push images.
automation:
  org: platform
  app: rhdh-demo-automation
  scopes: repo:read repo:write repo:admin repo:create user:read user:admin org:admin
# Organization for images built by software-template pipelines (robot <org>+ci, Secret
# quay-ci-push); repositories are created on push and are public.
ci:
  org: development
