apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-setup
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-setup
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [create]}
  - {apiGroups: [""], resources: [secrets], resourceNames: [quay-db, quay-config, quay-admin, clair-db, clair-config], verbs: [get]}
  - {apiGroups: [""], resources: [secrets], resourceNames: [quay-config, quay-admin, quay-ci-push, clair-config], verbs: [patch]}
  - {apiGroups: [""], resources: [secrets], resourceNames: [quay-ci-push], verbs: [get]}
  - {apiGroups: [apps], resources: [deployments], resourceNames: [quay, clair], verbs: [get, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-setup
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: quay-setup}
subjects: [{kind: ServiceAccount, name: quay-setup}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quay-setup-scripts
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
data:
  make-secrets.sh: {{ .Files.Get "files/make-secrets.sh" | quote }}
  init-admin.sh: {{ .Files.Get "files/init-admin.sh" | quote }}
  mint-token.py: {{ .Files.Get "files/mint-token.py" | quote }}
  ci-robot.py: {{ .Files.Get "files/ci-robot.py" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-secrets
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: quay-setup
      restartPolicy: Never
      containers:
        - name: secrets
          image: {{ .Values.images.cli }}
          command: [/bin/bash, /scripts/make-secrets.sh]
          env:
            - {name: APPS_DOMAIN, value: {{ .Values.appsDomain | quote }}}
            - {name: ADMIN_USER, value: {{ .Values.adminUser | quote }}}
            - {name: SCANNER_ENDPOINT, value: {{ .Values.scanner.endpoint | quote }}}
            - {name: CLAIR_UPDATERS, value: {{ .Values.clair.updaters | quote }}}
          volumeMounts: [{name: scripts, mountPath: /scripts}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      volumes: [{name: scripts, configMap: {name: quay-setup-scripts}}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-init-admin
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: quay-setup
      restartPolicy: Never
      containers:
        - name: init
          image: {{ .Values.images.cli }}
          command: [/bin/bash, /scripts/init-admin.sh]
          env:
            - {name: ADMIN_USER, value: {{ .Values.adminUser | quote }}}
            - {name: APPS_DOMAIN, value: {{ .Values.appsDomain | quote }}}
            - {name: ORG, value: {{ .Values.automation.org | quote }}}
            - {name: APP, value: {{ .Values.automation.app | quote }}}
            - {name: SCOPES, value: {{ .Values.automation.scopes | quote }}}
            - {name: CI_ORG, value: {{ .Values.ci.org | quote }}}
          volumeMounts: [{name: scripts, mountPath: /scripts}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      volumes: [{name: scripts, configMap: {name: quay-setup-scripts}}]
---
# Software-template pipelines (namespaces demo-*, service account pipeline) read the CI
# robot's credentials to push to Quay. Kubernetes RBAC can't name "every pipeline account",
# so every service account may read this one Secret: it can only push to organization
# {{ .Values.ci.org }}.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-ci-push-readers
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [quay-ci-push], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-ci-push-readers
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: quay-ci-push-readers}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:serviceaccounts"}]
