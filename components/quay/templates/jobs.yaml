apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-setup
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-setup
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [create]}
  - {apiGroups: [""], resources: [secrets], resourceNames: [quay-db, quay-config, quay-admin], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-setup
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: quay-setup}
subjects: [{kind: ServiceAccount, name: quay-setup}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quay-setup-scripts
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
data:
  make-secrets.sh: {{ .Files.Get "files/make-secrets.sh" | quote }}
  init-admin.sh: {{ .Files.Get "files/init-admin.sh" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-secrets
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: quay-setup
      restartPolicy: Never
      containers:
        - name: secrets
          image: {{ .Values.images.cli }}
          command: [/bin/bash, /scripts/make-secrets.sh]
          env:
            - {name: APPS_DOMAIN, value: {{ .Values.appsDomain | quote }}}
            - {name: ADMIN_USER, value: {{ .Values.adminUser | quote }}}
          volumeMounts: [{name: scripts, mountPath: /scripts}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      volumes: [{name: scripts, configMap: {name: quay-setup-scripts}}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-init-admin
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: quay-setup
      restartPolicy: Never
      containers:
        - name: init
          image: {{ .Values.images.cli }}
          command: [/bin/bash, /scripts/init-admin.sh]
          env:
            - {name: ADMIN_USER, value: {{ .Values.adminUser | quote }}}
          volumeMounts: [{name: scripts, mountPath: /scripts}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      volumes: [{name: scripts, configMap: {name: quay-setup-scripts}}]
