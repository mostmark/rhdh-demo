# A small CI pipeline for the Tekton tab. Each Argo CD sync of this app starts one run
# (PostSync Job below); start more with `tkn pipeline start hello-service-ci -n demo-hello`.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hello-service-ci
  namespace: demo-hello
  labels:
    backstage.io/kubernetes-id: hello-service
spec:
  tasks:
    - name: build
      taskSpec:
        steps:
          - name: build
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              echo "Building hello-service"
              sleep 10
              echo "Build complete"
    - name: test
      runAfter: [build]
      taskSpec:
        steps:
          - name: test
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              echo "Running tests"
              sleep 5
              echo "All tests passed"
    - name: deploy
      runAfter: [test]
      taskSpec:
        steps:
          - name: deploy
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              echo "Deployment is managed by Argo CD (application hello-service)"
---
# OpenShift GitOps excludes PipelineRuns from Argo CD, so a PostSync Job starts the run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-service-ci-starter
  namespace: demo-hello
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hello-service-ci-starter
  namespace: demo-hello
rules:
  - {apiGroups: [tekton.dev], resources: [pipelineruns], verbs: [create]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hello-service-ci-starter
  namespace: demo-hello
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hello-service-ci-starter}
subjects: [{kind: ServiceAccount, name: hello-service-ci-starter, namespace: demo-hello}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-service-ci-start
  namespace: demo-hello
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: hello-service-ci-starter
      restartPolicy: Never
      containers:
        - name: start
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              oc create -n demo-hello -f - <<'RUN'
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                generateName: hello-service-ci-
                labels:
                  backstage.io/kubernetes-id: hello-service
              spec:
                pipelineRef: {name: hello-service-ci}
                taskRunTemplate: {serviceAccountName: default}
              RUN
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
