# Sample workload. The backstage.io/kubernetes-id label links every resource to the
# catalog Component hello-service (Kubernetes, Topology and Tekton tabs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: demo-hello
  labels:
    app: hello-service
    app.kubernetes.io/name: hello-service
    app.kubernetes.io/part-of: demo-platform
    app.openshift.io/runtime: apache
    backstage.io/kubernetes-id: hello-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: hello-service}
  template:
    metadata:
      labels:
        app: hello-service
        app.kubernetes.io/name: hello-service
        backstage.io/kubernetes-id: hello-service
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          volumeMounts:
            - {name: content, mountPath: /var/www/html}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: content
          configMap: {name: hello-service-content}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-service-content
  namespace: demo-hello
  labels:
    backstage.io/kubernetes-id: hello-service
data:
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><title>Hello Service</title></head>
    <body style="font-family: sans-serif; margin: 3rem">
      <h1>Hello from hello-service</h1>
      <p>Deployed by Argo CD from the demo layer in GitLab.</p>
    </body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: demo-hello
  labels:
    app: hello-service
    backstage.io/kubernetes-id: hello-service
spec:
  selector: {app: hello-service}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hello-service
  namespace: demo-hello
  labels:
    app: hello-service
    backstage.io/kubernetes-id: hello-service
spec:
  to: {kind: Service, name: hello-service}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
