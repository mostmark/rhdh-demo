# The demo organisation: teams and people, applied to Keycloak realm sso by the platform's
# org sync Job after every demo-layer sync. Developer Hub imports them from Keycloak.
# Team access: the platform team ("platform": true, or the team named platform-team) gets
# role platform-admin in Developer Hub and sees all demo apps in Argo CD; every other team
# gets role developer and sees the apps in its Argo CD project team-<team>.
# People sign in with the demo password (Secret keycloak/demo-credentials). Removing a
# team or person here removes it from Keycloak (and from the catalog).
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-org
  namespace: keycloak
  annotations:
    # before the platform's team-access hook (wave -1), which derives Developer Hub RBAC,
    # OpenShift groups and Argo CD team projects from it
    argocd.argoproj.io/sync-wave: '-2'
data:
  org.json: |
    {
      "company": {"name": "demo-company", "displayName": "Demo Company",
                  "description": "Sample organisation (fictitious)"},
      "teams": [
        {"name": "platform-team", "displayName": "Platform Team",
         "description": "Runs the platform and the developer portal",
         "members": [
           {"username": "platform1", "firstName": "Pat", "lastName": "Platform", "email": "platform1@demo.example"}
         ]},
        {"name": "app-team", "displayName": "App Team",
         "description": "Builds the sample services",
         "members": [
           {"username": "developer1", "firstName": "Dana", "lastName": "Developer", "email": "developer1@demo.example"},
           {"username": "developer2", "firstName": "Devon", "lastName": "Coder", "email": "developer2@demo.example"}
         ]}
      ]
    }
