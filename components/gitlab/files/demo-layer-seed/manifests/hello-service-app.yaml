# Argo CD application for the sample workload, in the owning team's project team-app-team
# (made by the platform's team-access hook; Developer Hub's Argo CD account can read it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-service
  namespace: openshift-gitops
  labels:
    backstage.io/kubernetes-id: hello-service
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: team-app-team
  destination: {server: https://kubernetes.default.svc, namespace: demo-hello}
  source:
    repoURL: https://gitlab.__APPS_DOMAIN__/demo/rhdh-demo-config.git
    targetRevision: main
    path: apps/hello-service
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 10, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
