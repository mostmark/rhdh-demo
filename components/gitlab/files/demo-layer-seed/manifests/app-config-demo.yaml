apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-demo
  namespace: rhdh
data:
  # unique key: it becomes a file next to the platform's app-config-base.yaml
  app-config-demo.yaml: |
    app:
      title: Developer Hub Demo
    catalog:
      locations:
        - type: url
          target: https://gitlab.__APPS_DOMAIN__/demo/rhdh-demo-config/-/blob/main/catalog/all.yaml
          rules:
            - allow: [Location, Domain, System, Component, API, Resource, Template]
        - type: url
          target: https://gitlab.__APPS_DOMAIN__/demo/rhdh-demo-config/-/blob/main/templates/all.yaml
          rules:
            - allow: [Location, Template]
