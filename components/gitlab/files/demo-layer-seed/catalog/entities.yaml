apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: demo
  title: Demo
  description: Sample domain; replace with the demo company's catalog.
spec:
  owner: group:default/platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: demo-platform
  title: Demo Platform
  description: Shared platform services.
spec:
  owner: group:default/platform-team
  domain: demo
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hello-service
  title: Hello Service
  description: A sample service.
  tags: [quarkus, java]
spec:
  type: service
  lifecycle: experimental
  owner: group:default/app-team
  system: demo-platform
  providesApis: [hello-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: hello-api
  title: Hello API
  description: Returns a greeting.
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/app-team
  system: demo-platform
  definition: |
    openapi: 3.0.3
    info: {title: Hello API, version: 1.0.0}
    paths:
      /hello:
        get:
          summary: Say hello
          responses:
            '200': {description: A greeting}
