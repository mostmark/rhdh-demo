{{- if (.Values.components | default dict).quay }}
# Runs during every demo-layer sync, before the workload Applications (sync wave -1;
# the demo layer's ConfigMap quay/demo-quay is in wave -2): makes the demo's Quay
# organisation, public repositories and image tags exist, so the workloads can pull
# them. Uses the Quay admin token (Secret quay/quay-admin), in namespace quay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhdh-demo-quay-sync
  namespace: quay
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
data:
  quay-sync.sh: {{ .Files.Get "files/quay-sync.sh" | quote }}
  quay-copy.sh: {{ .Files.Get "files/quay-copy.sh" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhdh-demo-quay-sync
  namespace: quay
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: repos
          image: {{ .Values.quay.cliImage }}
          command: [/bin/bash, /script/quay-sync.sh]
          env:
            - {name: APPS_DOMAIN, value: {{ .Values.appsDomain | quote }}}
            - name: QUAY_TOKEN
              valueFrom: {secretKeyRef: {name: quay-admin, key: token}}
          volumeMounts:
            - {name: script, mountPath: /script}
            - {name: repos, mountPath: /quay}
            - {name: work, mountPath: /work}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      containers:
        - name: copy
          image: {{ .Values.quay.skopeoImage }}
          command: [/bin/bash, /script/quay-copy.sh]
          env:
            - {name: HOME, value: /work}            # skopeo writes ~/.local; / is read-only
            - name: QUAY_TOKEN
              valueFrom: {secretKeyRef: {name: quay-admin, key: token}}
          volumeMounts:
            - {name: script, mountPath: /script}
            - {name: work, mountPath: /work}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
      volumes:
        - {name: script, configMap: {name: rhdh-demo-quay-sync}}
        - {name: repos, configMap: {name: demo-quay, optional: true}}
        - {name: work, emptyDir: {}}
{{- end }}
