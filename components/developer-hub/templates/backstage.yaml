apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: {{ .Values.name }}
spec:
  flavours:
    - name: intelligent-assistant      # on by default in 2.1; no AI backend in this demo
      enabled: false
  application:
    route:
      host: developer-hub.{{ .Values.appsDomain }}
    appConfig:
      configMaps:
        - name: app-config-base
        - name: app-config-demo        # from the demo layer (in-cluster GitLab)
    dynamicPluginsConfigMapName: dynamic-plugins
    extraEnvs:
      envs:
        # The backend bootstraps global-agent (corporate proxy support), which by default
        # replaces every custom HTTPS agent, so the Kubernetes plugin's caFile and
        # skipTLSVerify are lost. With 'false' it only applies to requests without an agent.
        - name: GLOBAL_AGENT_FORCE_GLOBAL_AGENT
          value: "false"
      secrets:
        - name: rhdh-secrets             # created by bootstrap.sh
        - name: rhdh-integrations        # GitLab and Argo CD tokens, filled by the seed Jobs
        - name: rhdh-k8s-reader-token    # becomes the env var 'token'
          key: token
    extraFiles:
      secrets:
        - name: rhdh-k8s-reader-token    # cluster CA for the Kubernetes plugins (no SA token mount in the pod)
          key: ca.crt
          mountPath: /opt/app-root/src/k8s-ca
  deployment:
    patch:
      spec:
        template:
          spec:
            volumes:
              - name: dynamic-plugins-root
                ephemeral:
                  volumeClaimTemplate:
                    spec:
                      resources:
                        requests:
                          storage: {{ .Values.pluginVolumeSize }}
