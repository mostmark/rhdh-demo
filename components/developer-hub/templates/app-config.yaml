{{- $host := printf "developer-hub.%s" .Values.appsDomain }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins
data:
  {{- $plugins := .Files.Get "files/dynamic-plugins.yaml" }}
  {{- if (.Values.components | default dict).quay }}
  {{- $plugins = printf "%s%s" $plugins (.Files.Get "files/dynamic-plugins-quay.yaml") }}
  {{- end }}
  dynamic-plugins.yaml: {{ $plugins | quote }}
---
# Platform defaults. The demo layer's app-config-demo is loaded after this and wins.
# RHDH 2.1 plugin defaults (catalog index) also read env vars, e.g. GITLAB_HOST,
# K8S_CLUSTER_*, KEYCLOAK_*; the explicit values here override them.
# Secrets come from environment variables (rhdh-secrets, rhdh-integrations, the
# Kubernetes reader token); Developer Hub reaches other tools through their routes,
# because its NetworkPolicies only allow egress on 443/6443.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-base
data:
  # The key becomes the file name under /opt/app-root/src/: every app-config ConfigMap
  # referenced by the Backstage CR needs a unique key, or one file overwrites the other.
  app-config-base.yaml: |
    app:
      baseUrl: https://{{ $host }}
    backend:
      baseUrl: https://{{ $host }}
      cors:
        origin: https://{{ $host }}
    auth:
      environment: production
      session:
        secret: ${SESSION_SECRET}
      providers:
        keycloak:
          production:
            baseUrl: ${KEYCLOAK_BASE_URL}
            realm: ${KEYCLOAK_REALM}
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
    signInPage: keycloak
    integrations:
      gitlab:
        - host: gitlab.{{ .Values.appsDomain }}
          apiBaseUrl: https://gitlab.{{ .Values.appsDomain }}/api/v4
          token: ${GITLAB_TOKEN}
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Domain, Template]
      providers:
        keycloakOrg:
          default:
            baseUrl: ${KEYCLOAK_BASE_URL}
            loginRealm: ${KEYCLOAK_LOGIN_REALM}
            realm: ${KEYCLOAK_REALM}
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            schedule:
              frequency: {minutes: 15}
              timeout: {minutes: 5}
              initialDelay: {seconds: 15}
        gitlab:
          default:                       # same id as the plugin's default config, so this overrides it
            host: gitlab.{{ .Values.appsDomain }}
            group: {{ .Values.gitlabDiscoveryGroup }}
            entityFilename: catalog-info.yaml
            schedule:
              frequency: {minutes: 15}
              timeout: {minutes: 5}
    {{- if (.Values.components | default dict).quay }}
    # Quay backend + frontend plugins; the demo's repositories are public, so no token
    quay:
      apiUrl: https://quay.{{ .Values.appsDomain }}
      uiUrl: https://quay.{{ .Values.appsDomain }}
    {{- end }}
    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: https://openshift-gitops-server-openshift-gitops.{{ .Values.appsDomain }}
              token: ${ARGOCD_TOKEN}
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: local
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              caFile: /opt/app-root/src/k8s-ca/ca.crt   # needs GLOBAL_AGENT_FORCE_GLOBAL_AGENT=false (Backstage CR)
              serviceAccountToken: ${token}
      customResources:
        - {group: tekton.dev, apiVersion: v1, plural: pipelineruns}
        - {group: tekton.dev, apiVersion: v1, plural: taskruns}
        - {group: route.openshift.io, apiVersion: v1, plural: routes}
